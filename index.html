<header class="topbar">
  <div class="brand">📒 财务工作台</div>
  <div class="company-switcher">
    <span class="store-badge" title="数据保存在本机浏览器（IndexedDB），不上传服务器">💾 本地存储</span>
    <select id="companySelect" title="切换公司"></select>
    <button type="button" class="btn" id="addCompanyBtn">＋ 新公司</button>
    <button type="button" class="btn" id="manageCompanyBtn">管理</button>

  </div>
</header>

<div class="layout">
  <nav class="sidenav">
    <button type="button" data-view="ledger" class="active"><svg class="nav-ico"><use href="#ico-ledger"/></svg>流水记账</button>
    <button type="button" data-view="accounts"><svg class="nav-ico"><use href="#ico-accounts"/></svg>账户</button>

    <div class="sidenav-foot">照片拖入 → 自动合成 PDF<br>账户 · 供应商客户 · 项目 · 票据，一站管理</div>
  </nav>
  <main id="main"></main>
</div>

<div id="dropOverlay" class="drop-overlay hidden">
  <div class="drop-overlay-inner">
    <div class="drop-hint">松开鼠标，选择文件处理方式</div>
    <div class="drop-zones">
      <div class="drop-zone" data-target="pdf">
        <div class="dz-icon">📄</div>
        <div class="dz-title">合成 PDF</div>
        <div class="dz-sub">照片 / PDF → 合并为一个 PDF</div>
      </div>
      <div class="drop-zone" data-target="files">
        <div class="dz-icon">🗂️</div>
        <div class="dz-title">存入文件库</div>
        <div class="dz-sub">任意格式 · 在线预览 / 下载</div>
      </div>
      <div class="drop-zone" data-target="txn">
        <div class="dz-icon">🧾</div>
        <div class="dz-title">记为流水单据</div>
        <div class="dz-sub">作为票据上传，关联流水</div>
      </div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var KEY = 'fw_theme';
    var btn = document.getElementById('themeToggle');
    function apply(theme) {
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    var saved = localStorage.getItem(KEY);
    apply(saved === 'dark' ? 'dark' : 'light');
    if (btn) btn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = dark ? 'light' : 'dark';
      apply(next);
      localStorage.setItem(KEY, next);
    });
  })();
</script>
